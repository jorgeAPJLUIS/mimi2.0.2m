<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mimi 2.0 - Núcleo Holográfico</title>
    <style>
        :root[data-theme="dark"] {
            --bg-main: #0f172a;
            --bg-header: #1e293b;
            --bg-input: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --user-bubble: #3b82f6;
            --mimi-bubble: #334155;
            --input-bg: #0f172a;
            --input-border: #475569;
            --btn-bg: #3b82f6;
        }
        body {
            font-family: sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
        }

        header {
            background: var(--bg-header);
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* ORBE POSICIONADO ACIMA DO INPUT */
        #orb-container-fixo {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px 0;
            background: var(--bg-main);
            z-index: 100;
        }

        .orb-wrapper {
            position: relative;
            width: 70px;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #hologram-orb {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: radial-gradient(circle, #38bdf8 0%, #0284c7 60%, #0369a1 100%);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.8), inset 0 0 10px rgba(255, 255, 255, 0.8);
            transition: transform 0.1s ease, background 0.3s ease;
            cursor: pointer;
            z-index: 2;
        }

        .orbital-ring {
            position: absolute;
            border-radius: 50%;
            border: 1px dashed rgba(56, 189, 248, 0.4);
            animation: girarOrbital 8s linear infinite;
            pointer-events: none;
        }

        .ring-1 {
            width: 62px;
            height: 62px;
            border-color: rgba(56, 189, 248, 0.6);
            animation-duration: 6s;
        }

        .ring-2 {
            width: 76px;
            height: 76px;
            border-style: dotted;
            border-color: rgba(14, 165, 233, 0.3);
            animation-duration: 12s;
            animation-direction: reverse;
        }

        .listening #hologram-orb {
            background: radial-gradient(circle, #ef4444 0%, #dc2626 60%, #991b1b 100%) !important;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.9), inset 0 0 12px rgba(255, 255, 255, 0.9) !important;
        }

        .listening .orbital-ring {
            border-color: rgba(239, 68, 68, 0.7);
            animation-duration: 2s;
        }

        .pulsing .orbital-ring {
            border-color: rgba(34, 197, 94, 0.8);
            animation-duration: 3s;
        }

        @keyframes girarOrbital {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #chat-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 15px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .user { background: var(--user-bubble); align-self: flex-end; }
        .mimi { background: var(--mimi-bubble); align-self: flex-start; }

        .typing-indicator {
            align-self: flex-start;
            background: var(--mimi-bubble);
            padding: 10px 14px;
            border-radius: 15px;
            display: none;
            gap: 4px;
            align-items: center;
            margin-bottom: 5px;
        }
        .typing-indicator.active { display: flex; }
        .typing-indicator span {
            width: 7px;
            height: 7px;
            background: var(--text-main);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        #input-container {
            width: 100%;
            box-sizing: border-box;
            display: flex;
            padding: 10px 12px;
            background: var(--bg-input);
            border-top: 1px solid var(--border-color);
            gap: 8px;
            align-items: center;
        }

        input {
            flex: 1;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--input-border);
            background: var(--input-bg);
            color: var(--text-main);
            outline: none;
            font-size: 15px;
            min-width: 0;
        }

        button {
            background: var(--btn-bg);
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            white-space: nowrap;
        }
        button:active { opacity: 0.8; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <div>Mimi 2.0 | <span id="userDisplay"></span></div>
        </div>
        <button onclick="limparMemoria()">🧹 Limpar</button>
    </header>

    <div id="chat-container"></div>

    <!-- Indicador de digitação -->
    <div class="typing-indicator" id="typingIndicator">
        <span></span><span></span><span></span>
    </div>

    <!-- ORBE HOLOGRÁFICO FIXO ACIMA DO INPUT -->
    <div id="orb-container-fixo">
        <div class="orb-wrapper" id="orbWrapper">
            <div class="orbital-ring ring-1"></div>
            <div class="orbital-ring ring-2"></div>
            <div id="hologram-orb"></div>
        </div>
    </div>

    <div id="input-container">
        <button id="micBtn" title="Falar com a Mimi">🎤</button>
        <input type="text" id="userInput" placeholder="Escreva algo..." onkeypress="if(event.key === 'Enter') enviarMensagem()">
        <button id="sendBtn" onclick="enviarMensagem()">Enviar</button>
    </div>

    <script>
        let nomeUsuario = localStorage.getItem('mimi_usuario');
        if (!nomeUsuario) {
            nomeUsuario = prompt("Como posso te chamar?");
            localStorage.setItem('mimi_usuario', nomeUsuario || "Convidado");
        }
        document.getElementById('userDisplay').textContent = nomeUsuario;

        let historicoConversa = [];
        try {
            const salvo = localStorage.getItem('mimi_historico');
            if (salvo) historicoConversa = JSON.parse(salvo);
            if (!Array.isArray(historicoConversa)) historicoConversa = [];
        } catch (e) {
            historicoConversa = [];
        }

        const MAX_MSG_LOCAL = 50;
        if (historicoConversa.length > MAX_MSG_LOCAL) {
            historicoConversa = historicoConversa.slice(-MAX_MSG_LOCAL);
        }

        const chatContainer = document.getElementById('chat-container');
        const orbWrapper = document.getElementById('orbWrapper');
        const orb = document.getElementById('hologram-orb');
        const typingIndicator = document.getElementById('typingIndicator');
        const sendBtn = document.getElementById('sendBtn');

        historicoConversa.forEach(msg => adicionarMensagem(msg.texto, msg.remetente));

        let recognition = null;
        if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
            recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'pt-BR';
            recognition.interimResults = false;

            const micBtn = document.getElementById('micBtn');

            micBtn.onclick = () => {
                try {
                    recognition.start();
                    micBtn.style.background = '#ef4444';
                    orbWrapper.classList.add('listening');
                } catch (e) {}
            };

            recognition.onresult = (event) => {
                const texto = event.results[0][0].transcript;
                document.getElementById('userInput').value = texto;
                micBtn.style.background = '';
                orbWrapper.classList.remove('listening');
                enviarMensagem();
            };

            recognition.onerror = () => {
                micBtn.style.background = '';
                orbWrapper.classList.remove('listening');
            };

            recognition.onend = () => {
                micBtn.style.background = '';
                orbWrapper.classList.remove('listening');
            };
        } else {
            document.getElementById('micBtn').style.display = 'none';
        }

        async function enviarMensagem() {
            const input = document.getElementById('userInput');
            const texto = input.value.trim();
            if (!texto) return;

            sendBtn.disabled = true;

            adicionarMensagem(texto, 'user');
            salvarNoHistorico('user', texto);
            input.value = '';

            typingIndicator.classList.add('active');
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const historicoParaEnviar = historicoConversa.slice(-10);
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        mensagem: texto,
                        historico: historicoParaEnviar,
                        nomeUsuario: nomeUsuario
                    })
                });

                if (!res.ok) throw new Error(`HTTP ${res.status}`);

                const data = await res.json();
                typingIndicator.classList.remove('active');

                if (data.resposta) {
                    adicionarMensagem(data.resposta, 'mimi');
                    salvarNoHistorico('mimi', data.resposta);
                    falar(data.resposta);
                } else {
                    adicionarMensagem("Resposta vazia do servidor.", 'mimi');
                }

            } catch (e) {
                typingIndicator.classList.remove('active');
                adicionarMensagem("Erro de conexão com a Mimi.", 'mimi');
            } finally {
                sendBtn.disabled = false;
            }
        }

        function salvarNoHistorico(remetente, texto) {
            historicoConversa.push({ remetente, texto, timestamp: Date.now() });
            if (historicoConversa.length > MAX_MSG_LOCAL) {
                historicoConversa = historicoConversa.slice(-MAX_MSG_LOCAL);
            }
            try {
                localStorage.setItem('mimi_historico', JSON.stringify(historicoConversa));
            } catch (e) {}
        }

        function adicionarMensagem(texto, remetente) {
            const div = document.createElement('div');
            div.className = `message ${remetente}`;
            div.textContent = texto;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function falar(texto) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();

            const textoLimpo = texto
                .replace(/[\u{1F600}-\u{1F64F}]/gu, '')
                .replace(/[\u{1F300}-\u{1F5FF}]/gu, '')
                .replace(/[\u{1F680}-\u{1F6FF}]/gu, '')
                .replace(/[\u{1F1E0}-\u{1F1FF}]/gu, '')
                .replace(/```[\s\S]*?```/g, ' código ')
                .replace(/\*\*(.*?)\*\*/g, '$1')
                .replace(/\*(.*?)\*/g, '$1');

            const ut = new SpeechSynthesisUtterance(textoLimpo);
            ut.lang = 'pt-BR';
            ut.rate = 1.1;

            let intervaloSacudir;
            ut.onstart = () => {
                orbWrapper.classList.add('pulsing');
                let expandir = true;
                intervaloSacudir = setInterval(() => {
                    orb.style.transform = expandir ? 'scale(1.15)' : 'scale(1.0)';
                    expandir = !expandir;
                }, 280);
            };

            ut.onend = () => {
                orbWrapper.classList.remove('pulsing');
                clearInterval(intervaloSacudir);
                orb.style.transform = 'scale(1)';
            };

            ut.onerror = () => {
                orbWrapper.classList.remove('pulsing');
                clearInterval(intervaloSacudir);
                orb.style.transform = 'scale(1)';
            };

            window.speechSynthesis.speak(ut);
        }

        function limparMemoria() {
            if (confirm("Deseja limpar o histórico de conversas?")) {
                localStorage.removeItem('mimi_historico');
                historicoConversa = [];
                chatContainer.innerHTML = '';
            }
        }
    </script>
</body>
</html>
