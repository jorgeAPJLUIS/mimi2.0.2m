<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mimi 2.0 - Memória Ativa</title>
    <style>
        /* (Seus estilos atuais permanecem iguais, apenas adicionei suporte a botões) */
        :root[data-theme="dark"] { --bg-main: #0f172a; --bg-header: #1e293b; --bg-input: #1e293b; --border-color: #334155; --text-main: #f8fafc; --user-bubble: #3b82f6; --mimi-bubble: #334155; --input-bg: #0f172a; --input-border: #475569; --btn-bg: #3b82f6; }
        body { font-family: sans-serif; background: var(--bg-main); color: var(--text-main); margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: var(--bg-header); padding: 15px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        #chat-container { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 15px; }
        .user { background: var(--user-bubble); align-self: flex-end; }
        .mimi { background: var(--mimi-bubble); align-self: flex-start; }
        #input-container { display: flex; padding: 15px; background: var(--bg-input); border-top: 1px solid var(--border-color); gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text-main); }
        button { background: var(--btn-bg); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <div>Mimi 2.0 | <span id="userDisplay"></span></div>
        <button onclick="limparMemoria()">🧹 Limpar Memória</button>
    </header>
    <div id="chat-container"></div>
    <div id="input-container">
        <button id="micBtn">🎤</button>
        <input type="text" id="userInput" placeholder="Escreva algo...">
        <button onclick="enviarMensagem()">Enviar</button>
    </div>

    <script>
        // 1. Identificação e Memória
        let nomeUsuario = localStorage.getItem('mimi_usuario');
        if (!nomeUsuario) {
            nomeUsuario = prompt("Como posso te chamar?");
            localStorage.setItem('mimi_usuario', nomeUsuario || "Convidado");
        }
        document.getElementById('userDisplay').textContent = nomeUsuario;

        let historicoConversa = JSON.parse(localStorage.getItem('mimi_historico')) || [];
        
        // Carregar mensagens salvas ao abrir
        const chatContainer = document.getElementById('chat-container');
        historicoConversa.forEach(msg => adicionarMensagem(msg.texto, msg.remetente));

        // 2. Lógica do Microfone (Consertada)
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'pt-BR';
        const micBtn = document.getElementById('micBtn');

        micBtn.onclick = () => {
            recognition.start();
            micBtn.style.background = '#ef4444'; // Vermelho quando ouvindo
        };

        recognition.onresult = (event) => {
            const texto = event.results[0][0].transcript;
            document.getElementById('userInput').value = texto;
            micBtn.style.background = '';
            enviarMensagem();
        };

        // 3. Envio e Salvamento
        async function enviarMensagem() {
            const input = document.getElementById('userInput');
            const texto = input.value.trim();
            if (!texto) return;

            adicionarMensagem(texto, 'user');
            salvarNoHistorico('user', texto);
            input.value = '';

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mensagem: texto, historico: historicoConversa, nomeUsuario: nomeUsuario })
                });
                const data = await res.json();
                adicionarMensagem(data.resposta, 'mimi');
                salvarNoHistorico('mimi', data.resposta);
                falar(data.resposta);
            } catch (e) { adicionarMensagem("Erro de conexão.", 'mimi'); }
        }

        function salvarNoHistorico(remetente, texto) {
            historicoConversa.push({ remetente, texto });
            localStorage.setItem('mimi_historico', JSON.stringify(historicoConversa));
        }

        function adicionarMensagem(texto, remetente) {
            const div = document.createElement('div');
            div.className = `message ${remetente}`;
            div.textContent = texto;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function falar(texto) {
            const ut = new SpeechSynthesisUtterance(texto);
            ut.lang = 'pt-BR';
            window.speechSynthesis.speak(ut);
        }

        function limparMemoria() {
            localStorage.removeItem('mimi_historico');
            historicoConversa = [];
            chatContainer.innerHTML = '';
        }
    </script>
</body>
</html>
