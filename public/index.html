<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mimi 2.0 - Assistente Pessoal</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #1e293b; padding: 15px; text-align: center; font-weight: bold; font-size: 1.2rem; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; padding-left: 20px; padding-right: 20px;}
        #chat-container { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 15px; line-height: 1.4; word-break: break-word; }
        .user { background: #3b82f6; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .mimi { background: #334155; color: #f8fafc; align-self: flex-start; border-bottom-left-radius: 2px; }
        #input-container { display: flex; padding: 15px; background: #1e293b; border-top: 1px solid #334155; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 1rem; outline: none; }
        button { background: #3b82f6; color: white; border: none; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        button:hover { background: #2563eb; }
        .voice-btn { background: #475569; font-size: 0.9rem; padding: 8px 12px; border-radius: 6px; }
        .voice-btn.active { background: #10b981; }
    </style>
</head>
<body>
    <header>
        <span>❤️ Mimi 2.0 - Seu Ecossistema</span>
        <button id="voiceToggle" class="voice-btn" onclick="alternarVoz()">🔊 Voz: Ligada</button>
    </header>
    <div id="chat-container">
        <div class="message mimi">Olá, Jorge! Como posso te ajudar e cuidar de você hoje?</div>
    </div>
    <div id="input-container">
        <input type="text" id="userInput" placeholder="Digite sua mensagem para a Mimi..." autofocus>
        <button onclick="enviarMensagem()">Enviar</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('userInput');
        let vozAtiva = true;

        function alternarVoz() {
            vozAtiva = !vozAtiva;
            const btn = document.getElementById('voiceToggle');
            if (vozAtiva) {
                btn.textContent = "🔊 Voz: Ligada";
                btn.className = "voice-btn active";
            } else {
                btn.textContent = "🔇 Voz: Desligada";
                btn.className = "voice-btn";
                window.speechSynthesis.cancel();
            }
        }

       function falarTexto(texto) {
            if (!vozAtiva || !('speechSynthesis' in window)) return;
            
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'pt-BR';
            utterance.rate = 1.1; 
            utterance.pitch = 1.0;

            const voices = window.speechSynthesis.getVoices();
            
            // Tenta encontrar uma voz que seja do Google ou Microsoft (costumam ser melhores)
            const vozMelhor = voices.find(v => 
                (v.name.includes('Google') || v.name.includes('Microsoft')) && 
                (v.lang === 'pt-BR' || v.lang === 'pt_BR')
            );
            
            // Se achar a melhor, usa ela, senão pega a primeira que achar em português
            const vozPadrao = voices.find(v => v.lang === 'pt-BR' || v.lang === 'pt_BR');
            
            utterance.voice = vozMelhor || vozPadrao;

            window.speechSynthesis.speak(utterance);
        }
            

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') enviarMensagem();
        });

        async function enviarMensagem() {
            const texto = userInput.value.trim();
            if (!texto) return;

            adicionarMensagem(texto, 'user');
            userInput.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mensagem: texto })
                });
                const data = await res.json();
                
                adicionarMensagem(data.resposta, 'mimi');
                falarTexto(data.resposta);

            } catch (err) {
                const erroMsg = 'Erro de conexão com os servidores da Mimi, Jorge.';
                adicionarMensagem(erroMsg, 'mimi');
                falarTexto(erroMsg);
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function adicionarMensagem(texto, remetente) {
            const div = document.createElement('div');
            div.className = `message ${remetente}`;
            div.textContent = texto;
            chatContainer.appendChild(div);
        }
    </script>
</body>
</html>
