<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mimi 2.0 - Núcleo Holográfico Cyberpunk</title>
    <style>
        :root[data-theme="dark"] {
            --bg-main: #05050a;
            --bg-header: #0a0a16;
            --bg-input: #0a0a16;
            --border-color: #00f0ff55;
            --text-main: #00ffcc;
            --user-bubble: #00f0ff22;
            --user-border: #00f0ff;
            --mimi-bubble: #101026;
            --mimi-border: #00ff66;
            --input-bg: #030308;
            --input-border: #00ff6677;
            --btn-bg: #00ff66;
            --btn-text: #05050a;
            --neon-glow: 0 0 10px rgba(0, 255, 102, 0.4);
            --neon-cyan: 0 0 10px rgba(0, 240, 255, 0.4);
        }

        body {
            font-family: 'Courier New', Courier, monospace, sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100dvh;
            overflow: hidden;
            box-sizing: border-box;
        }

        header {
            background: var(--bg-header);
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            flex-shrink: 0;
            box-shadow: var(--neon-cyan);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .voice-mode-badge {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 4px;
            background: #101026;
            border: 1px solid #00f0ff55;
            color: #00f0ff;
        }
        .voice-mode-badge.active {
            background: #00ff6633;
            border-color: #00ff66;
            color: #00ff66;
            box-shadow: var(--neon-glow);
        }

        #chat-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-image: linear-gradient(rgba(0, 255, 102, 0.02) 1px, transparent 1px);
            background-size: 100% 4px;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 6px;
            line-height: 1.4;
            word-wrap: break-word;
            font-size: 14px;
        }

        .user { 
            background: var(--user-bubble); 
            border: 1px solid var(--user-border);
            color: #00f0ff;
            align-self: flex-end; 
            box-shadow: var(--neon-cyan);
        }

        .mimi { 
            background: var(--mimi-bubble); 
            border: 1px solid var(--mimi-border);
            color: #00ff66;
            align-self: flex-start; 
            box-shadow: var(--neon-glow);
        }

        .typing-indicator {
            align-self: flex-start;
            background: var(--mimi-bubble);
            border: 1px solid var(--mimi-border);
            padding: 10px 14px;
            border-radius: 6px;
            display: none;
            gap: 4px;
            align-items: center;
            margin-bottom: 5px;
            box-shadow: var(--neon-glow);
        }
        .typing-indicator.active { display: flex; }
        .typing-indicator span {
            width: 7px;
            height: 7px;
            background: var(--mimi-border);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        #orb-container-fixo {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 6px 0;
            background: var(--bg-main);
            z-index: 100;
            flex-shrink: 0;
        }

        .orb-wrapper {
            position: relative;
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #hologram-orb {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: radial-gradient(circle, #00ff66 0%, #008f3f 60%, #004d22 100%);
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.9), inset 0 0 8px rgba(255, 255, 255, 0.8);
            transition: transform 0.1s ease, background 0.3s ease;
            cursor: pointer;
            z-index: 2;
        }

        .orbital-ring {
            position: absolute;
            border-radius: 50%;
            border: 1px dashed rgba(0, 255, 102, 0.5);
            animation: girarOrbital 8s linear infinite;
            pointer-events: none;
        }

        .ring-1 {
            width: 52px;
            height: 52px;
            border-color: rgba(0, 240, 255, 0.7);
            animation-duration: 6s;
        }

        .ring-2 {
            width: 64px;
            height: 64px;
            border-style: dotted;
            border-color: rgba(0, 255, 102, 0.4);
            animation-duration: 12s;
            animation-direction: reverse;
        }

        .listening #hologram-orb {
            background: radial-gradient(circle, #ff0055 0%, #b3003b 60%, #660022 100%) !important;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.9), inset 0 0 10px rgba(255, 255, 255, 0.9) !important;
        }

        .listening .orbital-ring {
            border-color: rgba(255, 0, 85, 0.8);
            animation-duration: 2s;
        }

        .pulsing .orbital-ring {
            border-color: rgba(0, 240, 255, 0.9);
            animation-duration: 3s;
        }

        @keyframes girarOrbital {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #input-container {
            width: 100%;
            box-sizing: border-box;
            display: flex;
            padding: 10px 12px;
            background: var(--bg-input);
            border-top: 1px solid var(--border-color);
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
            z-index: 101;
        }

        #userInput {
            flex: 1;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid var(--input-border);
            background: var(--input-bg);
            color: var(--text-main);
            outline: none;
            font-size: 14px;
            font-family: inherit;
            min-width: 0;
        }

        #userInput:focus {
            border-color: #00ff66;
            box-shadow: var(--neon-glow);
        }

        #input-container button {
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 10px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            font-family: inherit;
            flex-shrink: 0;
            box-shadow: var(--neon-glow);
            transition: opacity 0.2s;
        }
        #input-container button:active { opacity: 0.8; }
        #input-container button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <div>MIMI.SYS // <span id="userDisplay"></span></div>
        </div>
        <div style="display: flex; gap: 8px; align-items: center;">
            <div id="voiceBadge" class="voice-mode-badge">VOZ: OFF</div>
            <button onclick="limparMemoria()" style="flex-shrink:0;">🧹 PURGE</button>
        </div>
    </header>

    <div id="chat-container"></div>

    <div class="typing-indicator" id="typingIndicator">
        <span></span><span></span><span></span>
    </div>

    <div id="orb-container-fixo">
        <div class="orb-wrapper" id="orbWrapper">
            <div class="orbital-ring ring-1"></div>
            <div class="orbital-ring ring-2"></div>
            <div id="hologram-orb" title="Toque para alternar Modo Voz Contínuo"></div>
        </div>
    </div>

    <div id="input-container">
        <button id="micBtn" title="Ativar Modo Voz Nativo">🎙️</button>
        <input type="text" id="userInput" placeholder="Insira comando..." onkeypress="if(event.key === 'Enter') enviarMensagem()">
        <button id="sendBtn" onclick="enviarMensagem()">ENVIAR</button>
    </div>

    <script>
        // Usa sessionStorage para pedir o nome toda vez que a aba for aberta do zero
        let nomeUsuario = sessionStorage.getItem('mimi_usuario');
        if (!nomeUsuario || !nomeUsuario.trim()) {
            nomeUsuario = prompt("Como posso te chamar?");
            if (!nomeUsuario || !nomeUsuario.trim()) {
                nomeUsuario = "Convidado";
            }
            sessionStorage.setItem('mimi_usuario', nomeUsuario.trim());
        }
        document.getElementById('userDisplay').textContent = nomeUsuario;

        let historicoConversa = [];
        try {
            const salvo = sessionStorage.getItem('mimi_historico');
            if (salvo) historicoConversa = JSON.parse(salvo);
            if (!Array.isArray(historicoConversa)) historicoConversa = [];
        } catch (e) {
            historicoConversa = [];
        }

        const MAX_MSG_LOCAL = 50;
        if (historicoConversa.length > MAX_MSG_LOCAL) {
            historicoConversa = historicoConversa.slice(-MAX_MSG_LOCAL);
        }

        const chatContainer = document.getElementById('chat-container');
        const orbWrapper = document.getElementById('orbWrapper');
        const orb = document.getElementById('hologram-orb');
        const typingIndicator = document.getElementById('typingIndicator');
        const sendBtn = document.getElementById('sendBtn');
        const micBtn = document.getElementById('micBtn');
        const voiceBadge = document.getElementById('voiceBadge');

        historicoConversa.forEach(msg => adicionarMensagem(msg.texto, msg.remetente));

        let modoVozAtivo = false;
        let recognition = null;
        let aguardandoRespostaDaIA = false;

        if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
            recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'pt-BR';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            micBtn.onclick = alternarModoVoz;
            orb.onclick = alternarModoVoz;

            function alternarModoVoz() {
                modoVozAtivo = !modoVozAtivo;
                if (modoVozAtivo) {
                    voiceBadge.textContent = "VOZ: ON";
                    voiceBadge.classList.add('active');
                    micBtn.style.background = '#ff0055';
                    iniciarEscuta();
                } else {
                    desativarModoVoz();
                }
            }

            function desativarModoVoz() {
                modoVozAtivo = false;
                voiceBadge.textContent = "VOZ: OFF";
                voiceBadge.classList.remove('active');
                micBtn.style.background = '';
                orbWrapper.classList.remove('listening');
                try { recognition.stop(); } catch(e) {}
            }

            function iniciarEscuta() {
                if (!modoVozAtivo || aguardandoRespostaDaIA) return;
                try {
                    orbWrapper.classList.add('listening');
                    recognition.start();
                } catch (e) {}
            }

            recognition.onresult = (event) => {
                const texto = event.results[0][0].transcript.trim();
                orbWrapper.classList.remove('listening');
                if (texto) {
                    document.getElementById('userInput').value = texto;
                    enviarMensagem(true);
                }
            };

            recognition.onerror = () => {
                orbWrapper.classList.remove('listening');
                if (modoVozAtivo && !aguardandoRespostaDaIA) {
                    setTimeout(iniciarEscuta, 1000);
                }
            };

            recognition.onend = () => {
                orbWrapper.classList.remove('listening');
                if (modoVozAtivo && !aguardandoRespostaDaIA) {
                    setTimeout(iniciarEscuta, 500);
                }
            };

        } else {
            micBtn.style.display = 'none';
            voiceBadge.style.display = 'none';
        }

        async function enviarMensagem(veioPorVoz = false) {
            const input = document.getElementById('userInput');
            const texto = input.value.trim();
            if (!texto) return;

            aguardandoRespostaDaIA = true;
            if (recognition && modoVozAtivo) {
                try { recognition.stop(); } catch(e) {}
            }

            sendBtn.disabled = true;
            adicionarMensagem(texto, 'user');
            salvarNoHistorico('user', texto);
            input.value = '';

            typingIndicator.classList.add('active');
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const historicoParaEnviar = historicoConversa.slice(-10);
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        mensagem: texto,
                        historico: historicoParaEnviar,
                        nomeUsuario: nomeUsuario
                    })
                });

                if (!res.ok) throw new Error(`HTTP ${res.status}`);

                const data = await res.json();
                typingIndicator.classList.remove('active');

                if (data.resposta) {
                    adicionarMensagem(data.resposta, 'mimi');
                    salvarNoHistorico('mimi', data.resposta);
                    falar(data.resposta, () => {
                        aguardandoRespostaDaIA = false;
                        if (modoVozAtivo) {
                            setTimeout(iniciarEscuta, 600);
                        }
                    });
                } else {
                    aguardandoRespostaDaIA = false;
                    adicionarMensagem("Resposta vazia do servidor.", 'mimi');
                    if (modoVozAtivo) setTimeout(iniciarEscuta, 1000);
                }

            } catch (e) {
                typingIndicator.classList.remove('active');
                aguardandoRespostaDaIA = false;
                adicionarMensagem("Erro de conexão com a Mimi.", 'mimi');
                if (modoVozAtivo) setTimeout(iniciarEscuta, 2000);
            } finally {
                sendBtn.disabled = false;
            }
        }

        function salvarNoHistorico(remetente, texto) {
            historicoConversa.push({ remetente, texto, timestamp: Date.now() });
            if (historicoConversa.length > MAX_MSG_LOCAL) {
                historicoConversa = historicoConversa.slice(-MAX_MSG_LOCAL);
            }
            try {
                sessionStorage.setItem('mimi_historico', JSON.stringify(historicoConversa));
            } catch (e) {}
        }

        function adicionarMensagem(texto, remetente) {
            const div = document.createElement('div');
            div.className = `message ${remetente}`;
            div.textContent = texto;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function falar(texto, callbackFim) {
            if (!window.speechSynthesis) {
                if (callbackFim) callbackFim();
                return;
            }
            window.speechSynthesis.cancel();

            const textoLimpo = texto
                .replace(/[\u{1F600}-\u{1F64F}]/gu, '')
                .replace(/[\u{1F300}-\u{1F5FF}]/gu, '')
                .replace(/[\u{1F680}-\u{1F6FF}]/gu, '')
                .replace(/[\u{1F1E0}-\u{1F1FF}]/gu, '')
                .replace(/```[\s\S]*?```/g, ' trecho de código ')
                .replace(/\*\*(.*?)\*\*/g, '$1')
                .replace(/\*(.*?)\*/g, '$1');

            const ut = new SpeechSynthesisUtterance(textoLimpo);
            ut.lang = 'pt-BR';
            ut.rate = 1.1;

            let intervaloSacudir;
            ut.onstart = () => {
                orbWrapper.classList.add('pulsing');
                let expandir = true;
                intervaloSacudir = setInterval(() => {
                    orb.style.transform = expandir ? 'scale(1.15)' : 'scale(1.0)';
                    expandir = !expandir;
                }, 280);
            };

            const finalizarFala = () => {
                orbWrapper.classList.remove('pulsing');
                clearInterval(intervaloSacudir);
                orb.style.transform = 'scale(1)';
                if (callbackFim) callbackFim();
            };

            ut.onend = finalizarFala;
            ut.onerror = finalizarFala;

            window.speechSynthesis.speak(ut);
        }

        function limparMemoria() {
            if (confirm("Deseja limpar o histórico de conversas?")) {
                sessionStorage.removeItem('mimi_historico');
                historicoConversa = [];
                chatContainer.innerHTML = '';
            }
        }
    </script>
</body>
</html>
